<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const button = <button>hello</button>;
      const p =<p>paragraph of text</p>;
      
      const div = (
        <div>
          <button>hello</button>
          <p>paragraph of text {2 + 2}</p>
        </div>
      );
    function ProductDetails({name,price,discount,imgSrc}){
      const result = discount?
              <>
              <img src={imgSrc} width="30"/>
              <p>Product Name: {name}</p>
              <del><p>Price: {price}</p></del>
              <p>Discount: {discount}</p>
              </> :
              <>
              <img src={imgSrc} width="50"/>
              <p>Product Name: {name}</p>
              <p>Price: {price}</p>
              </>;

       return(
          <>
            {result}
            <button>Buy Now</button>
          </>
       );
    }
      function App(){
        return (
          <>
            <ProductDetails name="Laptop" price="$999" imgSrc="laptop.png"/>
            <ProductDetails name="Phone" price="$499" imgSrc="phone.png" />
            <ProductDetails name="Tablet" price="$299" discount="10%" imgSrc="tablet.png" />
            
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
